# Databricks Asset Bundle for the GM VOC topic-model POC.
#
# Deploy:   databricks bundle deploy  -t sandbox -p daria_k_sandbox
# Run:      databricks bundle run voc_topic_model_job -t sandbox -p daria_k_sandbox
# Destroy:  databricks bundle destroy -t sandbox -p daria_k_sandbox
bundle:
  name: gm_voc_topic_model

# Ship the engine + rules alongside the job so imports resolve on the cluster.
include: []

targets:
  sandbox:
    mode: development
    default: true
    workspace:
      host: https://adb-984752964297111.11.azuredatabricks.net

resources:
  jobs:

    # ----------------------------------------------------------------------
    # Track 1 — deterministic rule engine (XM Discover replica).
    # ----------------------------------------------------------------------
    voc_topic_model_job:
      name: "[${bundle.target}] GM VOC Topic Model (rules)"
      tasks:
        - task_key: tag_verbatims
          # Serverless: no cluster to configure. Uses the workspace default.
          notebook_task:
            notebook_path: ./rule_engine/run_job_notebook.py
            base_parameters:
              sentence_table: daria_krasavina.gm_voc.qualtrics_audio_transcripts_sentence_level_sample_data
              metadata_table: daria_krasavina.gm_voc.qualtrics_audio_transcripts_metadata_sample_data
              tags_table: daria_krasavina.gm_voc.voc_topic_tags
              freq_table: daria_krasavina.gm_voc.voc_topic_frequencies
              date_start: "2025-07-01"
              date_end: "2026-06-30"
      queue:
        enabled: true

    # ----------------------------------------------------------------------
    # Track 2 — lightweight AI-powered solution (Databricks AI functions):
    # AI classify + topic discovery. AI functions require serverless + DBR 18.2+.
    # ----------------------------------------------------------------------
    voc_ai_pipeline_job:
      name: "[${bundle.target}] GM VOC Lightweight AI Solution (ai_classify + discovery)"
      tasks:
        - task_key: ai_classify
          notebook_task:
            notebook_path: ./ai_solution/run_ai_classify_notebook.py
            base_parameters:
              sentence_table: daria_krasavina.gm_voc.qualtrics_audio_transcripts_sentence_level_sample_data
              metadata_table: daria_krasavina.gm_voc.qualtrics_audio_transcripts_metadata_sample_data
              ai_tags_table: daria_krasavina.gm_voc.voc_ai_topic_tags
              date_start: "2025-07-01"
              date_end: "2026-06-30"
              ai_version: "2.1"
              sample_limit: "200"

        - task_key: topic_discovery
          notebook_task:
            notebook_path: ./ai_solution/run_topic_discovery_notebook.py
            base_parameters:
              sentence_table: daria_krasavina.gm_voc.qualtrics_audio_transcripts_sentence_level_sample_data
              themes_table: daria_krasavina.gm_voc.voc_discovered_themes
              assignments_table: daria_krasavina.gm_voc.voc_theme_assignments
              date_start: "2025-07-01"
              date_end: "2026-06-30"
              embedding_endpoint: databricks-gte-large-en
              gen_endpoint: databricks-meta-llama-3-3-70b-instruct
              num_clusters: "12"
              sample_limit: "200"
      queue:
        enabled: true

    # ----------------------------------------------------------------------
    # Cross-track comparison — rules (Track 1) vs. ai_classify (Track 2).
    # Standalone job: run it AFTER both voc_topic_model_job and
    # voc_ai_pipeline_job have produced their tag tables.
    # ----------------------------------------------------------------------
    voc_compare_job:
      name: "[${bundle.target}] GM VOC Compare (rules vs AI)"
      tasks:
        - task_key: compare_approaches
          notebook_task:
            notebook_path: ./ai_solution/run_compare_notebook.py
            base_parameters:
              rule_tags_table: daria_krasavina.gm_voc.voc_topic_tags
              ai_tags_table: daria_krasavina.gm_voc.voc_ai_topic_tags
              comparison_table: daria_krasavina.gm_voc.voc_approach_comparison
      queue:
        enabled: true

    # ----------------------------------------------------------------------
    # Track 3 — trained transformer sentiment model (Qualtrics-faithful).
    # train: weak-label via LLM -> fine-tune DistilBERT -> log/register in MLflow.
    # score: apply the registered model + VADER lexicon baseline.
    # Requires Databricks Runtime for ML (GPU recommended for training).
    # ----------------------------------------------------------------------
    voc_sentiment_model_job:
      name: "[${bundle.target}] GM VOC Sentiment Model (train + score)"
      tasks:
        - task_key: train_sentiment
          notebook_task:
            notebook_path: ./sentiment_model/run_train_sentiment_notebook.py
            base_parameters:
              sentence_table: daria_krasavina.gm_voc.qualtrics_audio_transcripts_sentence_level_sample_data
              date_start: "2025-07-01"
              date_end: "2026-06-30"
              label_endpoint: databricks-meta-llama-3-3-70b-instruct
              sample_limit: "300"
              base_model: distilbert-base-uncased
              num_train_epochs: "3"
              batch_size: "16"
              experiment_path: /Shared/gm_voc_sentiment
              registered_model: daria_krasavina.gm_voc.voc_sentiment_transformer
              weak_labels_table: daria_krasavina.gm_voc.voc_sentiment_weak_labels

        - task_key: score_sentiment
          depends_on:
            - task_key: train_sentiment
          notebook_task:
            notebook_path: ./sentiment_model/run_score_sentiment_notebook.py
            base_parameters:
              sentence_table: daria_krasavina.gm_voc.qualtrics_audio_transcripts_sentence_level_sample_data
              scored_table: daria_krasavina.gm_voc.voc_sentiment_scored
              registered_model: daria_krasavina.gm_voc.voc_sentiment_transformer
              model_alias: champion
              date_start: "2025-07-01"
              date_end: "2026-06-30"
              sample_limit: "300"
      queue:
        enabled: true
