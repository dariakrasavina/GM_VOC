# Databricks Asset Bundle for the GM VOC POC.
#
# Deploy:   databricks bundle deploy  -t sandbox -p daria_k_sandbox
# Run:      databricks bundle run voc_classification_rule_job -t sandbox -p daria_k_sandbox
# Destroy:  databricks bundle destroy -t sandbox -p daria_k_sandbox
bundle:
  name: gm_voc

# Ship the engine + category model alongside the job so imports resolve on the cluster.
include: []

targets:
  sandbox:
    mode: development
    default: true
    workspace:
      host: https://adb-984752964297111.11.azuredatabricks.net

resources:
  jobs:

    # ----------------------------------------------------------------------
    # Classification (using rule engine) — applies GM's category model rules.
    # ----------------------------------------------------------------------
    voc_classification_rule_job:
      name: "[${bundle.target}] GM VOC Classification (rule engine)"
      tasks:
        - task_key: classify_rules
          # Serverless: no cluster to configure. Uses the workspace default.
          notebook_task:
            notebook_path: ./classification_rule_engine/run_job_notebook.py
            base_parameters:
              sentence_table: daria_krasavina.gm_voc.qualtrics_audio_transcripts_sentence_level_sample_data
              metadata_table: daria_krasavina.gm_voc.qualtrics_audio_transcripts_metadata_sample_data
              tags_table: daria_krasavina.gm_voc.voc_classification_rule_tags
              freq_table: daria_krasavina.gm_voc.voc_classification_rule_frequencies
              date_start: "2025-07-01"
              date_end: "2026-06-30"
      queue:
        enabled: true

    # ----------------------------------------------------------------------
    # Classification (using ai_classify) + topic modeling.
    # AI functions require serverless + DBR 18.2+.
    # ----------------------------------------------------------------------
    voc_classification_ai_job:
      name: "[${bundle.target}] GM VOC Classification (ai_classify) + Topic Modeling"
      tasks:
        - task_key: classify_ai
          notebook_task:
            notebook_path: ./classification_ai/run_ai_classify_notebook.py
            base_parameters:
              sentence_table: daria_krasavina.gm_voc.qualtrics_audio_transcripts_sentence_level_sample_data
              metadata_table: daria_krasavina.gm_voc.qualtrics_audio_transcripts_metadata_sample_data
              ai_tags_table: daria_krasavina.gm_voc.voc_classification_ai_tags
              date_start: "2025-07-01"
              date_end: "2026-06-30"
              ai_version: "2.1"
              sample_limit: "200"

        - task_key: topic_modeling
          notebook_task:
            notebook_path: ./topic_modeling/run_topic_discovery_notebook.py
            base_parameters:
              sentence_table: daria_krasavina.gm_voc.qualtrics_audio_transcripts_sentence_level_sample_data
              themes_table: daria_krasavina.gm_voc.voc_topicmodeling_themes
              assignments_table: daria_krasavina.gm_voc.voc_topicmodeling_assignments
              date_start: "2025-07-01"
              date_end: "2026-06-30"
              embedding_endpoint: databricks-gte-large-en
              gen_endpoint: databricks-meta-llama-3-3-70b-instruct
              num_clusters: "12"
              sample_limit: "200"
      queue:
        enabled: true

    # ----------------------------------------------------------------------
    # Comparison — Classification (rule engine) vs. Classification (ai_classify).
    # Standalone job: run it AFTER both classification jobs have produced tags.
    # ----------------------------------------------------------------------
    voc_classification_compare_job:
      name: "[${bundle.target}] GM VOC Classification Compare (rule engine vs ai_classify)"
      tasks:
        - task_key: compare_classification
          notebook_task:
            notebook_path: ./classification_ai/run_compare_notebook.py
            base_parameters:
              rule_tags_table: daria_krasavina.gm_voc.voc_classification_rule_tags
              ai_tags_table: daria_krasavina.gm_voc.voc_classification_ai_tags
              comparison_table: daria_krasavina.gm_voc.voc_classification_comparison
      queue:
        enabled: true

    # ----------------------------------------------------------------------
    # Sentiment model — complementary track (how the customer feels).
    # train: weak-label via LLM -> fine-tune DistilBERT -> log/register in MLflow.
    # score: apply the registered model + VADER baseline.
    # Requires Databricks Runtime for ML (GPU recommended for training).
    # ----------------------------------------------------------------------
    voc_sentiment_model_job:
      name: "[${bundle.target}] GM VOC Sentiment Model (train + score)"
      tasks:
        - task_key: train_sentiment
          notebook_task:
            notebook_path: ./sentiment_model/run_train_sentiment_notebook.py
            base_parameters:
              sentence_table: daria_krasavina.gm_voc.qualtrics_audio_transcripts_sentence_level_sample_data
              date_start: "2025-07-01"
              date_end: "2026-06-30"
              label_endpoint: databricks-meta-llama-3-3-70b-instruct
              sample_limit: "300"
              base_model: distilbert-base-uncased
              num_train_epochs: "3"
              batch_size: "16"
              experiment_path: /Shared/gm_voc_sentiment
              registered_model: daria_krasavina.gm_voc.voc_sentiment_transformer
              weak_labels_table: daria_krasavina.gm_voc.voc_sentiment_weak_labels

        - task_key: score_sentiment
          depends_on:
            - task_key: train_sentiment
          notebook_task:
            notebook_path: ./sentiment_model/run_score_sentiment_notebook.py
            base_parameters:
              sentence_table: daria_krasavina.gm_voc.qualtrics_audio_transcripts_sentence_level_sample_data
              scored_table: daria_krasavina.gm_voc.voc_sentiment_scored
              registered_model: daria_krasavina.gm_voc.voc_sentiment_transformer
              model_alias: champion
              date_start: "2025-07-01"
              date_end: "2026-06-30"
              sample_limit: "300"
      queue:
        enabled: true
